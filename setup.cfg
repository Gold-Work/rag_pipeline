[flake8]
max-line-length = 120
extend-ignore = E203, W503
per-file-ignores =
    scripts/run_ingestion.py: E402
    scripts/run_query.py: E402
    scripts/verify_ingestion.py: E402
exclude =
    .venv,
    __pycache__,
    .git,
    data,
    logs

[mypy]
python_version = 3.12
ignore_missing_imports = True
exclude = ^tests/
