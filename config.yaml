cache:
  max_size: 100
  ttl_seconds: 3600

retrieval:
  chunk_size: 1200
  chunk_overlap: 200
  top_k_retrieval: 20
  top_k_rerank: 5
  min_rrf_score: 0.0  # seuil minimum sur le score RRF (0 = pas de filtre ; ~0.01 filtre les rangs très bas)

embedding:
  model: text-embedding-3-small
  collection_name: rag_documents
  batch_size: 100

rewriter:
  enabled: true       # activer/désactiver la réécriture
  n_variants: 3
  temperature: 0.3

reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

llm:
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 1000

paths:
  raw_data: ./data/raw
  chroma_db: ./data/chroma_db
  ingested_files: ./data/ingested_files.json
  logs: ./logs
  