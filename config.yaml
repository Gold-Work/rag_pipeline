cache:
  max_size: 100
  ttl_seconds: 3600

retrieval:
  chunk_size: 1200
  chunk_overlap: 200
  top_k_retrieval: 10
  top_k_rerank: 5
  rrf_min_score: 0.0     # score RRF : ~0.003 (rang 20, une source) à ~0.033 (rang 0, deux sources)
  vector_min_score: 0.0  # cosine similarity normalisée par LangChain : 0 = orthogonal, 1 = identique
  bm25_min_score: 0.0    # score BM25/Okapi TF-IDF : 0 = aucun terme commun, N = très pertinent

embedding:
  model: text-embedding-3-small
  collection_name: rag_documents
  batch_size: 100

rewriter:
  enabled: false       # activer/désactiver la réécriture
  n_variants: 1
  temperature: 0.3
  system_prompt: |
    Tu es un expert en recherche documentaire dans des documents administratifs et juridiques français.
    Génère {n} reformulations différentes de la question suivante pour maximiser les chances de trouver la réponse.

    Règles :
    - Utilise les équivalents français : SIRET = SIREN = RCS = numéro d'immatriculation = numéro d'identification
    - Utilise les équivalents : siège social = adresse = domiciliation = établissement principal
    - Varie entre forme question et forme mot-clé court
    - Inclus des reformulations courtes type "mot-clé valeur"
    - Retourne UNIQUEMENT les reformulations, une par ligne, sans numérotation ni explication

    Question originale : {question}

    Reformulations :

reranker:
  model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1  # multilingue (30+ langues dont français)

llm:
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 1000

paths:
  raw_data: ./data/raw
  chroma_db: ./data/chroma_db
  ingested_files: ./data/ingested_files.json
  logs: ./logs
