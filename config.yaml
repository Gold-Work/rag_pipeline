retrieval:
  chunk_size: 512
  chunk_overlap: 50
  top_k_retrieval: 20
  top_k_rerank: 5

embedding:
  model: text-embedding-3-small

rewriter:
  enabled: true       # activer/désactiver la réécriture
  n_variants: 3
  temperature: 0.3

llm:
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 1000

paths:
  raw_data: ./data/raw
  chroma_db: ./data/chroma_db
  logs: ./logs
  